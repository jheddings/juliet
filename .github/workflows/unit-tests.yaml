---
name: Unit Tests

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit_test:
    runs-on: ubuntu-latest

    strategy:
      max-parallel: 3
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - uses: actions/checkout@v7.0.0

      - name: Setup uv w/ python-${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v8.3.1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build dependencies
        run: uv sync --all-extras

      - name: Run unit tests
        run: uv run pytest tests/
